[project]
name = "pitchside"
version = "0.1.0"
description = "Explainable, personalised match intelligence from synthetic football events"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# Cloud mode: Microsoft Agent Framework agents on Microsoft Foundry
foundry = [
  "agent-framework-core>=1.22",
  "agent-framework-foundry>=1.15",
  "azure-identity>=1.17",
]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
